[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blackhole-lab"
version = "0.2.0"
description = "Numerical experiments for Schwarzschild photon trajectories"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
ml = ["torch>=2.2"]
rl = ["gymnasium>=1.0", "stable-baselines3>=2.5", "tensorboard>=2.17"]
test-rl = ["gymnasium>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"


[project.scripts]
blackhole-analytics = "bh_analytics.dashboard:main"
blackhole-report = "bh_analytics.report:main"

[tool.setuptools.package-data]
bh_analytics = ["templates/*.html", "assets/*.css", "assets/*.js"]
